services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sentinel
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: sentinel
      MYSQL_ROOT_PASSWORD: sentinel-root
    ports:
      - "3307:3306"          # 3307 on your machine, so it won't clash with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usentinel", "-psentinel"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://sentinel:sentinel@mysql:3306/sentinel
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      CHROMA_DIR: /data/chroma
      SECRET_KEY: ${SECRET_KEY:-change-me-before-sharing}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-sentinel}
      CORS_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama running on your machine
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
      - model_cache:/root/.cache              # embedding model, downloaded once
      - ./backend/reports:/app/reports        # evaluation reports land in your folder
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  chroma_data:
  model_cache:
